# กฎจัดกลุ่มคำตอบของร้าน (ตอบคำถามแรก "เปิดขายอยู่ไหม")
#
# - ตรวจจากบนลงล่าง เจอกลุ่มแรกที่ตรงแล้วหยุด ถ้าไม่ตรงกลุ่มไหนใช้ default
# - patterns เป็น regular expression (Python) เทียบกับข้อความที่ตัดช่องว่าง ตัวอักษรซ้ำ และแปลงเป็นตัวพิมพ์เล็กแล้ว
#   จึงไม่ต้องใส่ช่องว่างใน pattern
# - ⚠️ "เปิด" มีคำว่า "ปิด" อยู่ในตัว (เ + ปิด) เช่น "เปิดร้านแล้ว" มี "ปิดร้านแล้ว" อยู่ข้างใน
#   pattern ที่ขึ้นต้นด้วย ปิด ต้องใส่ (?<!เ) นำหน้าเสมอ

groups:
  - name: complaint            # ไม่พอใจ / ถามที่มาของเบอร์
    reply: B4
    status: DECLINED
    do_not_contact: true
    alert: true
    patterns: ["ใครให้เบอร์", "เบอร์.*จากไหน", "สแปม", "spam", "รำคาญ", "อย่าทัก", "บล็อก", "block"]

  - name: wrong_number
    reply: B6
    status: DECLINED
    do_not_contact: true
    shop_state: UNKNOWN
    patterns: ["ผิดเบอร์", "ทักผิด", "ไม่ใช่ร้าน", "ไม่ใช่เบอร์ร้าน", "ไม่รู้จักร้าน"]

  - name: refuse
    reply: B5
    status: DECLINED
    do_not_contact: true
    patterns: ["ไม่สนใจ", "ไม่เอา", "ไม่ต้อง", "มีเจ้าประจำ", "ไม่รับ"]

  - name: closed               # ปิดกิจการ (ไม่ใช่ "วันนี้ปิด")
    reply: B3
    status: CLOSED
    do_not_contact: true
    shop_state: CLOSED
    patterns: ["(?<!เ)ปิดกิจการ", "(?<!เ)ปิดร้านแล้ว", "(?<!เ)ปิดไปแล้ว", "เลิกขาย", "เลิกกิจการ", "เลิกทำ",
               "เซ้ง", "ไม่ได้ขายแล้ว", "ไม่ขายแล้ว", "ไม่เปิดแล้ว", "ไม่ได้เปิดแล้ว"]

  - name: not_open_yet
    reply: B2
    status: PITCHED
    shop_state: NOT_OPEN_YET
    patterns: ["ยังไม่เปิด", "ยังไม่ได้เปิด", "กำลังจะเปิด", "ใกล้จะเปิด", "ใกล้เปิด", "เปิด(เดือน|อาทิตย์|สัปดาห์)หน้า",
               "ยังไม่ได้ขาย", "ยังไม่ขาย", "กำลังเตรียมร้าน", "กำลังตกแต่ง"]

default:                       # คำตอบอื่นทั้งหมด เช่น เปิดค่ะ, ใช่, มีอะไรครับ, ใครครับ, สติกเกอร์
  name: other
  reply: B1
  status: PITCHED

# ใช้เดาว่าร้านเปิดแล้ว (shop_state = OPEN) เมื่อคำตอบตกกลุ่ม default
open_patterns: ["(?<!ไม่)เปิด", "^ใช่", "ขายอยู่", "ขายปกติ", "ขายทุกวัน"]
