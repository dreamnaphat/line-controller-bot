# selector ของหน้าจอแอป LINE (jp.naver.line.android) ที่บอทใช้กดปุ่ม
#
# ตรวจจากหน้าจอจริง: HONOR DNY-NX9 (Honor 400 Pro), Android 16, LINE 26.15.1, ภาษาไทย — 20 ต.ค. 2026
# ถ้า LINE อัปเดตแล้วบอทหาปุ่มไม่เจอ ให้รัน `python -m bot dump <ชื่อหน้าจอ>` แล้วแก้ไฟล์นี้
#
# แต่ละรายการใส่ได้หลาย selector บอทจะลองตามลำดับ คีย์ที่ใช้ได้:
#   resourceId, text, textContains, textStartsWith, description, descriptionContains,
#   descriptionStartsWith, className, xpath

home_tab:                   # แท็บ "หน้าหลัก" ด้านล่าง (desc เป็น "แท็บหน้าหลัก" หรือ "แท็บหน้าหลัก เลือกแล้ว")
  - resourceId: jp.naver.line.android:id/bnb_button_clickable_area
    descriptionStartsWith: แท็บหน้าหลัก

add_friend_button:          # ไอคอนเพิ่มเพื่อนมุมขวาบนของหน้าหลัก
  - resourceId: jp.naver.line.android:id/add_friends_header_button

add_friend_page:            # ใช้ยืนยันว่าเข้าหน้า "เพิ่มเพื่อน" แล้ว (หน้านี้ไม่มี resourceId)
  - text: คิวอาร์โค้ดของฉัน

search_entry:               # เมนู "ค้นหา" ในหน้าเพิ่มเพื่อน
  - text: ค้นหา

phone_search_option:        # ตัวเลือก "หมายเลขโทรศัพท์" ในหน้าค้นหาเพื่อน
  - resourceId: jp.naver.line.android:id/addfriend_by_userphone_status_radio

search_input:               # ช่องกรอกเบอร์ (รหัสประเทศ +66 ตั้งไว้แล้ว ใส่เบอร์แบบ 0812345678 ได้เลย)
  - resourceId: jp.naver.line.android:id/addfriend_by_phone_search_text

search_submit:              # ปุ่มค้นหา (ห้ามใช้ desc "ค้นหา" เพราะชนกับปุ่มบนคีย์บอร์ด)
  - resourceId: jp.naver.line.android:id/addfriend_by_phone_search_button

result_add_button:          # ผลค้นหา: ยังไม่เป็นเพื่อน → ปุ่ม "เพิ่มเพื่อน"
  - resourceId: jp.naver.line.android:id/addfriend_add_button
    text: เพิ่มเพื่อน

result_chat_button:         # ปุ่ม "แชท" ในผลค้นหา (เป็นเพื่อนแล้ว หรือเพิ่งกดเพิ่มเพื่อน)
  - resourceId: jp.naver.line.android:id/addfriend_add_button
    text: แชท

result_not_found:           # ผลค้นหา: "ไม่พบผู้ใช้"
  - textContains: ไม่พบผู้ใช้

result_search_limited:      # ข้อความเมื่อถูกจำกัดการค้นหา — ยังไม่เคยเห็นของจริง เป็นการเดา
  - textContains: จำกัด
  - textContains: ภายหลัง

chat_header_name:           # ชื่อเพื่อนที่แถบบนของห้องแชท — แตะแล้วเปิดหน้าโปรไฟล์ (รูปในผลค้นหากดไม่ได้)
  - resourceId: jp.naver.line.android:id/main_view_group
    clickable: true

friend_name_edit:           # ไอคอนดินสอข้างชื่อในหน้าโปรไฟล์เพื่อน
  - resourceId: jp.naver.line.android:id/user_profile_edit_name

name_edit_input:            # ช่องแก้ชื่อ (ยาวได้สูงสุด 20 ตัวอักษร)
  - resourceId: jp.naver.line.android:id/edit_name

name_edit_save:             # ปุ่ม "บันทึก"
  - resourceId: jp.naver.line.android:id/save_button

profile_close:              # ปุ่มปิดหน้าโปรไฟล์ กลับไปห้องแชท
  - resourceId: jp.naver.line.android:id/user_profile_back

chat_input:                 # ช่องพิมพ์ข้อความในห้องแชท
  - resourceId: jp.naver.line.android:id/chat_ui_message_edit

chat_send_button:           # ปุ่มส่ง
  - resourceId: jp.naver.line.android:id/chat_ui_send_button_image

result_name:                # ชื่อโปรไฟล์ LINE ในผลค้นหา (บันทึกไว้ในคิว)
  - resourceId: jp.naver.line.android:id/addfriend_name

chat_tab:                   # แท็บ "แชท" ด้านล่าง
  - resourceId: jp.naver.line.android:id/bnb_button_clickable_area
    descriptionStartsWith: แท็บแชท

chat_tab_selected:          # ใช้ยืนยันว่าอยู่ในหน้ารายการแชทแล้ว
  - resourceId: jp.naver.line.android:id/bnb_button_clickable_area
    descriptionStartsWith: แท็บแชท เลือกแล้ว
